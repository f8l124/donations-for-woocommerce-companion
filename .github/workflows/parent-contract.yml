name: Parent contract watcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  watch:
    name: Hash parent line ranges vs baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check parent zip secret
        id: check
        env:
          PARENT_URL: ${{ secrets.DFWC_PARENT_ZIP_URL }}
        run: |
          if [ -z "$PARENT_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Parent contract watcher skipped::DFWC_PARENT_ZIP_URL secret is unset. The parent plugin (Donation For Woocommerce by WPExperts) is a paid Woo extension and can't be auto-fetched from wp.org. To enable this workflow, upload the parent zip somewhere CI can reach (e.g. private GH release, S3 with signed URL) and set the DFWC_PARENT_ZIP_URL secret on this repo. See docs/ci.md."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip == 'false'

      - name: Set up PHP 8.1
        if: steps.check.outputs.skip == 'false'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: none

      - name: Download parent zip from secret URL
        if: steps.check.outputs.skip == 'false'
        env:
          PARENT_URL: ${{ secrets.DFWC_PARENT_ZIP_URL }}
        run: |
          set -e
          mkdir -p tests/parent-source
          curl -sSLf -o /tmp/parent.zip "$PARENT_URL"
          unzip -q /tmp/parent.zip -d tests/parent-source/
          # Locate the donation-for-woocommerce/ directory inside the extract.
          PARENT_DIR=$(find tests/parent-source -maxdepth 2 -name 'class-wcdonation.php' -printf '%h\n' | head -1)
          if [ -z "$PARENT_DIR" ]; then
            echo "ERROR: could not locate class-wcdonation.php in extracted zip"
            exit 1
          fi
          echo "PARENT_DIR=$PARENT_DIR" >> "$GITHUB_ENV"

      - name: Run watcher
        if: steps.check.outputs.skip == 'false'
        env:
          DFWC_PARENT_PATH: ${{ env.PARENT_DIR }}
        run: php tests/parent-contract.test.php
