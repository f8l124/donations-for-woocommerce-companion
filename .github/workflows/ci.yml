name: CI

on:
  push:
    branches: [main, "v0.6.x"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # === PHP syntax lint across supported versions ===
  php-lint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Lint PHP files
        run: |
          find includes templates donations-for-woocommerce-companion.php -name '*.php' -print0 \
            | xargs -0 -n1 php -l

  # === WordPress Coding Standards ===
  phpcs:
    name: PHPCS (WPCS + PHPCompatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: composer:v2
          coverage: none
      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dev dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Run PHPCS
        run: composer lint:phpcs

  # === Static analysis ===
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2
          coverage: none
      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dev dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Run PHPStan
        run: composer analyze

  # === Unit tests ===
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2
          coverage: xdebug
      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dev dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Run PHPUnit
        run: composer test:unit

  # === Parent plugin contract watcher (gated on secret) ===
  parent-contract:
    name: Parent Contract Watcher
    runs-on: ubuntu-latest
    steps:
      - name: Check parent zip secret
        id: check
        env:
          PARENT_URL: ${{ secrets.DFWC_PARENT_ZIP_URL }}
        run: |
          if [ -z "$PARENT_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Parent contract skipped::DFWC_PARENT_ZIP_URL secret is unset. The parent plugin is paid and can't be fetched from wp.org. Set the secret to enable this check. See docs/ci.md."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.check.outputs.skip == 'false'
      - uses: shivammathur/setup-php@v2
        if: steps.check.outputs.skip == 'false'
        with:
          php-version: "7.4"
          coverage: none
      - name: Download parent zip
        if: steps.check.outputs.skip == 'false'
        env:
          PARENT_URL: ${{ secrets.DFWC_PARENT_ZIP_URL }}
        run: |
          set -e
          mkdir -p tests
          curl -sSLf -o /tmp/parent.zip "$PARENT_URL"
          unzip -q /tmp/parent.zip -d tests/
          # Normalize directory name regardless of zip's internal naming
          if [ -d tests/donation-for-woocommerce-master ]; then
            mv tests/donation-for-woocommerce-master tests/donation-for-woocommerce
          fi
      - name: Run contract watcher
        if: steps.check.outputs.skip == 'false'
        run: php tests/parent-contract.test.php

  # === Plugin Check ===
  # Gated on parent zip: Plugin Check honors our `Requires Plugins:` header
  # which lists the paid parent plugin, and can't bootstrap without it.
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Check parent zip secret
        id: check
        env:
          PARENT_URL: ${{ secrets.DFWC_PARENT_ZIP_URL }}
        run: |
          if [ -z "$PARENT_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Plugin Check skipped::DFWC_PARENT_ZIP_URL secret is unset. Plugin Check requires the paid parent plugin to bootstrap (Requires Plugins: header). Set the secret to enable."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.check.outputs.skip == 'false'
      - uses: actions/setup-node@v6
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: "22"
          cache: npm
      - uses: shivammathur/setup-php@v2
        if: steps.check.outputs.skip == 'false'
        with:
          php-version: "8.1"
          coverage: none
      - name: Install npm deps
        if: steps.check.outputs.skip == 'false'
        run: npm ci
      - name: Build distribution zip
        if: steps.check.outputs.skip == 'false'
        run: npm run build:zip
      - name: Extract zip for Plugin Check
        if: steps.check.outputs.skip == 'false'
        run: |
          cd dist
          unzip -q donations-for-woocommerce-companion.zip
          ls -la donations-for-woocommerce-companion/
      - name: Make parent zip available to Plugin Check
        if: steps.check.outputs.skip == 'false'
        env:
          PARENT_URL: ${{ secrets.DFWC_PARENT_ZIP_URL }}
        run: |
          mkdir -p tests
          curl -sSLf -o tests/donation-for-woocommerce.zip "$PARENT_URL"
      - name: Run Plugin Check
        if: steps.check.outputs.skip == 'false'
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./dist/donations-for-woocommerce-companion
          exclude-directories: tests,docs,plans,.wolf,.claude

  # === Playwright E2E (gated on parent secret; matrix on engine fixture) ===
  playwright:
    name: Playwright E2E (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fixture: [none, wps]
    steps:
      - name: Check parent zip secret
        id: check
        env:
          PARENT_URL: ${{ secrets.DFWC_PARENT_ZIP_URL }}
        run: |
          if [ -z "$PARENT_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Playwright skipped::DFWC_PARENT_ZIP_URL secret is unset."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.check.outputs.skip == 'false'
      - uses: actions/setup-node@v6
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: "22"
          cache: npm
      - name: Install npm deps
        if: steps.check.outputs.skip == 'false'
        run: npm install
      - name: Install Playwright browsers
        if: steps.check.outputs.skip == 'false'
        run: npx playwright install --with-deps chromium
      - name: Download parent zip
        if: steps.check.outputs.skip == 'false'
        env:
          PARENT_URL: ${{ secrets.DFWC_PARENT_ZIP_URL }}
        run: |
          set -e
          mkdir -p tests
          curl -sSLf -o tests/donation-for-woocommerce.zip "$PARENT_URL"
      - name: Start wp-env (${{ matrix.fixture }})
        if: steps.check.outputs.skip == 'false'
        run: |
          if [ "${{ matrix.fixture }}" = "wps" ]; then
            npx wp-env start --config .wp-env.wps.json
          else
            npx wp-env start --config .wp-env.none.json
          fi
      - name: Wait for WordPress to be reachable
        if: steps.check.outputs.skip == 'false'
        run: |
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:8889/ > /dev/null 2>&1; then
              echo "WP up"
              break
            fi
            sleep 2
          done
          curl -sSf http://localhost:8889/ > /dev/null
      - name: Confirm parent + WC active
        if: steps.check.outputs.skip == 'false'
        run: |
          npx wp-env run cli wp plugin list --status=active --field=name | tee /tmp/active.txt
          grep -q '^woocommerce$' /tmp/active.txt
          grep -E '^donation-?for-?woocommerce$' /tmp/active.txt
      - name: Run Playwright
        if: steps.check.outputs.skip == 'false'
        env:
          CI: "true"
        run: npx playwright test --project=${{ matrix.fixture }}
      - name: Upload Playwright report on failure
        if: failure() && steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.fixture }}
          path: playwright-report/
          retention-days: 7
      - name: wp-env logs on failure
        if: failure() && steps.check.outputs.skip == 'false'
        run: npx wp-env logs all || true
      - name: Stop wp-env
        if: always() && steps.check.outputs.skip == 'false'
        run: npx wp-env stop || true

  # === Zip install validation (gated on parent secret) ===
  zip-validate:
    name: Zip Install Validation
    runs-on: ubuntu-latest
    needs: [php-lint, plugin-check]
    steps:
      - name: Check parent zip secret
        id: check
        env:
          PARENT_URL: ${{ secrets.DFWC_PARENT_ZIP_URL }}
        run: |
          if [ -z "$PARENT_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Zip validation skipped::DFWC_PARENT_ZIP_URL unset."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.check.outputs.skip == 'false'
      - uses: actions/setup-node@v6
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: "22"
          cache: npm
      - name: Install npm deps
        if: steps.check.outputs.skip == 'false'
        run: npm install
      - name: Build zip
        if: steps.check.outputs.skip == 'false'
        run: npm run build:zip
      - name: Download parent zip
        if: steps.check.outputs.skip == 'false'
        env:
          PARENT_URL: ${{ secrets.DFWC_PARENT_ZIP_URL }}
        run: |
          mkdir -p tests
          curl -sSLf -o tests/donation-for-woocommerce.zip "$PARENT_URL"
      - name: Boot wp-env and install zip
        if: steps.check.outputs.skip == 'false'
        run: |
          npx wp-env start --config .wp-env.none.json
          # Install our companion zip into wp-env, activate it, verify
          docker cp dist/donations-for-woocommerce-companion.zip "$(docker ps -qf 'name=wp-env-cli')":/tmp/companion.zip
          npx wp-env run cli wp plugin install /tmp/companion.zip --activate
          npx wp-env run cli wp plugin list --status=active --field=name | grep -q '^donations-for-woocommerce-companion$'
      - name: Stop wp-env
        if: always() && steps.check.outputs.skip == 'false'
        run: npx wp-env stop || true
