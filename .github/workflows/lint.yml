name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    name: PHP syntax (php -l)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: none

      - name: php -l on every PHP file
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null 2>&1 || { echo "SYNTAX ERROR: $f"; fail=1; }
          done < <(find . -path ./node_modules -prune -o -path ./vendor -prune -o -path ./tests/donation-for-woocommerce -prune -o -name '*.php' -type f -print0)
          if [ "$fail" -ne 0 ]; then exit 1; fi

      - name: Set up PHP 8.3 (forward-compat smoke)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: none

      - name: php -l (PHP 8.3)
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null 2>&1 || { echo "SYNTAX ERROR (PHP 8.3): $f"; fail=1; }
          done < <(find . -path ./node_modules -prune -o -path ./vendor -prune -o -path ./tests/donation-for-woocommerce -prune -o -name '*.php' -type f -print0)
          if [ "$fail" -ne 0 ]; then exit 1; fi

  node:
    name: Node syntax (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check JS files
        run: |
          set -e
          for f in assets/js/*.js assets/blocks/recurring-donation/*.js scripts/*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
